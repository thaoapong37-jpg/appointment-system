services:
  postgres:
    image: postgres:16-alpine
    container_name: appointment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Thaopong1234
      POSTGRES_DB: appointment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appointment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: appointment-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@appointment.vn
      PGADMIN_DEFAULT_PASSWORD: Thaopong1234
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./Backend
    container_name: appointment-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: Thaopong1234
      DB_NAME: appointment_db
      JWT_SECRET: appointment_super_secret_key_2025
    ports:
      - "5000:5000"
    volumes:
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./Frontend
    container_name: appointment-frontend
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://backend:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    container_name: appointment-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: appointment-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
      - postgres-exporter
      - node-exporter

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: appointment-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "postgres:5432/appointment_db?sslmode=disable"
      DATA_SOURCE_USER: "postgres"
      DATA_SOURCE_PASS: "Thaopong1234"
    depends_on:
      postgres:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:latest
    container_name: appointment-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro,rslave"

  loki:
    image: grafana/loki:latest
    container_name: appointment-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:latest
    container_name: appointment-promtail
    restart: unless-stopped
    volumes:
      - backend_logs:/var/log/appointment:ro
      - ./monitoring/loki/promtail-config.yml:/etc/promtail/config.yml:ro
    command:
      - "-config.file=/etc/promtail/config.yml"
    depends_on:
      - loki
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: appointment-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
  backend_logs:
  loki_data:

